components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Opaque access token'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        default: application/json
      description: 'Request JSON responses from the API.'
    CompanyIdHeader:
      name: X-Company-Id
      in: header
      required: false
      schema:
        type: integer
        example: 1
      description: 'Active company context for tenant-scoped endpoints.'
    ApiKeyHeader:
      name: X-API-Key
      in: header
      required: true
      schema:
        type: string
      description: 'External API key generated from organization API key management.'
  schemas:
    ApiEnvelope:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          nullable: true
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Success:
      description: 'Successful API response.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthenticated:
      description: 'Missing, invalid, or expired bearer token.'
    Forbidden:
      description: 'Authenticated user lacks permission or company context.'
    NotFound:
      description: 'Resource not found.'
    ValidationError:
      description: 'Validation failed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
